<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Flowchart Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f5f4f0; color: #1B2B4B; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  #topbar {
    background: #1B2B4B; color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px; height: 52px; flex-shrink: 0; user-select: none;
  }
  #topbar .logo { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; margin-right: 8px; }
  #topbar .logo span { color: #E8503A; }
  #topbar .sep { width: 1px; height: 28px; background: rgba(255,255,255,0.2); }
  .tb-btn {
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-family: inherit; transition: background 0.15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.2); }
  .tb-btn.notion-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
  .tb-btn.notion-btn:hover { background: rgba(255,255,255,0.25); }
  #topbar .spacer { flex: 1; }

  #palette {
    background: #fff; border-bottom: 1px solid #e5e5e5;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; flex-shrink: 0;
  }
  #palette .pal-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #888; margin-right: 4px; }
  .shape-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 12px; border: 1.5px solid #e0e0e0; border-radius: 6px;
    background: #fafafa; cursor: pointer; font-size: 12px; font-family: inherit; color: #333;
    transition: all 0.15s;
  }
  .shape-btn:hover { border-color: #1B2B4B; background: #f0f0f0; }
  .shape-btn svg { flex-shrink: 0; }
  .kbd {
    display: inline-block; background: #e8e8e8; color: #666;
    border-radius: 3px; font-size: 10px; font-weight: 700;
    padding: 1px 4px; margin-left: 2px; line-height: 1.4;
    font-family: 'Courier New', monospace;
  }
  #palette .sep { width: 1px; height: 28px; background: #e5e5e5; margin: 0 4px; }
  .mode-btn {
    padding: 5px 12px; border: 1.5px solid #e0e0e0; border-radius: 6px;
    background: #fafafa; cursor: pointer; font-size: 12px; font-family: inherit; color: #555;
    display: flex; align-items: center; gap: 6px;
  }
  .mode-btn.active { background: #1B2B4B; color: #fff; border-color: #1B2B4B; }
  .mode-btn.active .kbd { background: rgba(255,255,255,0.25); color: #fff; }

  #canvas-wrap {
    flex: 1; position: relative; overflow: hidden;
    background: #f5f4f0;
    background-image: radial-gradient(circle, #ccc 1px, transparent 1px);
    background-size: 24px 24px;
    cursor: default;
  }
  #canvas-wrap.connect-mode { cursor: crosshair; }

  #main-svg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: visible;
  }

  #selbox {
    display: none; position: absolute;
    border: 1.5px dashed #E8503A;
    background: rgba(232,80,58,0.07);
    pointer-events: none; z-index: 50;
  }

  .edge-label-bg { pointer-events: none; }
  .edge-label-text { pointer-events: none; font-size: 11px; font-family: 'Inter', system-ui, sans-serif; fill: #555; }

  #edge-label-input {
    display: none; position: absolute; z-index: 500;
    background: #fff; border: 1.5px solid #E8503A;
    border-radius: 6px; padding: 4px 8px; font-size: 12px;
    font-family: inherit; outline: none; min-width: 80px;
  }

  /* Floating textarea for inline node label editing */
  #node-edit-ta {
    display: none; position: absolute; z-index: 200;
    background: rgba(255,255,255,0.97);
    border: 2px solid #E8503A; border-radius: 6px;
    padding: 4px 8px; font-size: 12px; font-family: 'Inter', system-ui, sans-serif;
    color: #1B2B4B; line-height: 1.4; resize: none; outline: none;
    text-align: center; overflow: hidden;
    min-width: 60px; min-height: 28px;
  }

  #statusbar {
    background: #1B2B4B; color: rgba(255,255,255,0.6);
    font-size: 11px; padding: 4px 16px;
    display: flex; gap: 16px; flex-shrink: 0;
  }
  #statusbar span b { color: #fff; }

  .resize-handle { cursor: se-resize; fill: #6B7280; opacity: 0; transition: opacity 0.15s; }
  .node-g:hover .resize-handle,
  .node-g.selected .resize-handle { opacity: 0.7; }
  .node-g:hover .resize-handle:hover { opacity: 1; fill: #E8503A; }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo"><span>B</span>anner</div>
  <div class="logo" style="font-weight:400;font-size:13px;opacity:0.7">Flowchart Builder</div>
  <div class="sep"></div>
  <button class="tb-btn" onclick="clearCanvas()">&#128465; Clear</button>
  <button class="tb-btn" onclick="loadSample()">&#128203; Sample</button>
  <div class="spacer"></div>
  <span style="font-size:12px;opacity:0.5">Dbl-click shape to edit &middot; Dbl-click arrow to label it &middot; Drag ▪ corner to resize &middot; Del to delete</span>
  <div class="sep"></div>
  <button class="tb-btn notion-btn" onclick="saveToNotion()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:inline;vertical-align:-2px;margin-right:5px"><rect x="1" y="1" width="12" height="12" rx="2" fill="white" opacity="0.9"/><path d="M3.5 3.5h4l3 3.5-3 3.5h-4v-7z" fill="#1B2B4B" opacity="0.7"/></svg>
    Save to Notion
  </button>
</div>

<div id="palette">
  <span class="pal-label">Add Shape</span>
  <button class="shape-btn" onclick="addNode('step')">
    <svg width="16" height="12"><rect x="0" y="0" width="16" height="12" rx="2" fill="#fff" stroke="#D1D5DB" stroke-width="1.5"/></svg>
    Step <span class="kbd">S</span>
  </button>
  <button class="shape-btn" onclick="addNode('decision')">
    <svg width="16" height="16"><polygon points="8,0 16,8 8,16 0,8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/></svg>
    Decision <span class="kbd">D</span>
  </button>
  <button class="shape-btn" onclick="addNode('terminal')">
    <svg width="20" height="12"><rect x="0" y="0" width="20" height="12" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/></svg>
    Terminal <span class="kbd">T</span>
  </button>
  <button class="shape-btn" onclick="addNode('action')">
    <svg width="16" height="12"><rect x="0" y="0" width="16" height="12" rx="1" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/></svg>
    Action <span class="kbd">A</span>
  </button>
  <div class="sep"></div>
  <button class="mode-btn active" id="btn-select" onclick="setMode('select')">&#10022; Select <span class="kbd">V</span></button>
  <button class="mode-btn" id="btn-connect" onclick="setMode('connect')">&#10551; Connect <span class="kbd">C</span></button>
</div>

<div id="canvas-wrap">
  <div id="selbox"></div>
  <textarea id="node-edit-ta" rows="3"></textarea>
  <input id="edge-label-input" type="text" placeholder="Label…">
  <svg id="main-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
      </marker>
      <marker id="arrow-sel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="#E8503A"/>
      </marker>
      <marker id="arrow-pre" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="#E8503A"/>
      </marker>
    </defs>
    <g id="edges-g"></g>
    <g id="nodes-g"></g>
    <path id="preview-line" d="" stroke="#E8503A" stroke-width="1.5"
          stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-pre)"
          style="display:none; pointer-events:none"/>
    <path id="freehand-path" d="" stroke="#E8503A" stroke-width="2"
          stroke-dasharray="5,4" fill="none" stroke-linecap="round"
          style="display:none; pointer-events:none"/>
  </svg>
</div>

<div id="statusbar">
  <span>Nodes: <b id="st-nodes">0</b></span>
  <span>Connections: <b id="st-edges">0</b></span>
  <span>Mode: <b id="st-mode">Select</b></span>
  <span style="margin-left:auto;opacity:0.5">Double-click to edit &middot; Drag corner to resize &middot; Click edge to select &middot; Del to delete</span>
</div>


<script>
// ── Constants ───────────────────────────────────────────────────────────────
const NODE_W=140, NODE_H=48, TERM_H=40, DIAM_W=140, DIAM_H=80;
const SETBACK=9, CORNER_R=16;
const FONT_SIZE=12, LINE_H=16, PAD_X=10, PAD_Y=8;
const MIN_W={step:80,action:80,terminal:80,decision:100};
const MIN_H={step:36,action:36,terminal:32,decision:60};

// ── State ────────────────────────────────────────────────────────────────────
let nodes={}, edges=[];
let selected=new Set(), selectedEdges=new Set();
let nodeCounter=0, edgeCounter=0;
let mode='select';
let drag=null, resize=null, conn=null, snapPort=null, selBox=null, freehand=null;
let editingNodeId=null;

const wrap=document.getElementById('canvas-wrap');
const mainSvg=document.getElementById('main-svg');
const edgesG=document.getElementById('edges-g');
const nodesG=document.getElementById('nodes-g');
const previewLn=document.getElementById('preview-line');
const freehandP=document.getElementById('freehand-path');
const selBoxEl=document.getElementById('selbox');
const nodeEditTa=document.getElementById('node-edit-ta');

// ── SVG helpers ──────────────────────────────────────────────────────────────
const SVG_NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs={}){
  const el=document.createElementNS(SVG_NS,tag);
  for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);
  return el;
}

// ── Text measurement via hidden canvas ──────────────────────────────────────
const _mc=document.createElement('canvas').getContext('2d');
_mc.font=`${FONT_SIZE}px Inter,system-ui,sans-serif`;
function measureText(str){ return _mc.measureText(str).width; }

// Word-wrap text into lines that fit maxW pixels
function wrapText(text, maxW){
  const words=text.split(' ');
  const lines=[];
  let cur='';
  for(const w of words){
    const test=cur?cur+' '+w:w;
    if(measureText(test)<=maxW){ cur=test; }
    else{ if(cur)lines.push(cur); cur=w; }
  }
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}

// Build SVG <text> with <tspan> lines, centered in box (w×h)
function buildTextEl(label, w, h){
  const innerW=w-PAD_X*2;
  // For decision nodes, text area is smaller (diamond inset)
  const lines=wrapText(label, innerW);
  const totalH=lines.length*LINE_H;
  const startY=h/2 - totalH/2 + LINE_H*0.8; // baseline of first line

  const textEl=svgEl('text',{
    x:w/2, y:startY,
    'text-anchor':'middle',
    'font-size':FONT_SIZE,
    'font-family':'Inter,system-ui,sans-serif',
    fill:'#1B2B4B',
    'pointer-events':'none'
  });
  lines.forEach((line,i)=>{
    const ts=svgEl('tspan',{x:w/2, dy: i===0?'0':'1.35em'});
    ts.textContent=line;
    textEl.appendChild(ts);
  });
  return textEl;
}

// Rebuild text element in place (after label/size change)
function refreshTextEl(id){
  const n=nodes[id];if(!n)return;
  if(n.textEl)n.textEl.remove();
  n.textEl=buildTextEl(n.label, n.w, n.h);
  n.g.insertBefore(n.textEl, n.portEls['n']); // insert before ports so ports stay on top
}

// ── Coordinates ──────────────────────────────────────────────────────────────
function c2w(cx,cy){const r=wrap.getBoundingClientRect();return{x:cx-r.left,y:cy-r.top};}

function portOffset(node,port){
  const{w,h}=node;
  return{n:{x:w/2,y:0},s:{x:w/2,y:h},e:{x:w,y:h/2},w:{x:0,y:h/2}}[port];
}
function portPos(nid,port){
  const n=nodes[nid];if(!n)return{x:0,y:0};
  const o=portOffset(n,port);return{x:n.x+o.x,y:n.y+o.y};
}
function setback(x1,y1,x2,y2,amt){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  if(len<amt+1)return{x:x2,y:y2};
  return{x:x2-dx/len*amt,y:y2-dy/len*amt};
}

// ── Rounded orthogonal path ───────────────────────────────────────────────────
function straightPath(x1,y1,x2,y2,fp,tp){
  const fv=fp==='n'||fp==='s', tv=tp==='n'||tp==='s';
  let pts;
  if(Math.abs(y1-y2)<2&&!fv&&!tv) pts=[[x1,y1],[x2,y2]];
  else if(Math.abs(x1-x2)<2&&fv&&tv) pts=[[x1,y1],[x2,y2]];
  else if(fv&&tv){const my=(y1+y2)/2;pts=[[x1,y1],[x1,my],[x2,my],[x2,y2]];}
  else if(!fv&&!tv){const mx=(x1+x2)/2;pts=[[x1,y1],[mx,y1],[mx,y2],[x2,y2]];}
  else if(fv) pts=[[x1,y1],[x1,y2],[x2,y2]];
  else        pts=[[x1,y1],[x2,y1],[x2,y2]];

  const last=pts.length-1,prev=pts[last-1],end=pts[last];
  const sb=setback(prev[0],prev[1],end[0],end[1],SETBACK);
  pts[last]=[sb.x,sb.y];

  if(pts.length===2)
    return`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} L${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)}`;

  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){
    const p=pts[i-1],c=pts[i],n=pts[i+1];
    const d1x=c[0]-p[0],d1y=c[1]-p[1],d2x=n[0]-c[0],d2y=n[1]-c[1];
    const l1=Math.hypot(d1x,d1y),l2=Math.hypot(d2x,d2y);
    const r=Math.min(CORNER_R,l1/2,l2/2);
    const bx=c[0]-d1x/l1*r,by=c[1]-d1y/l1*r;
    const ax=c[0]+d2x/l2*r,ay=c[1]+d2y/l2*r;
    d+=` L${bx.toFixed(1)},${by.toFixed(1)} Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${ax.toFixed(1)},${ay.toFixed(1)}`;
  }
  const fin=pts[pts.length-1];
  d+=` L${fin[0].toFixed(1)},${fin[1].toFixed(1)}`;
  return d;
}

// ── Mode ─────────────────────────────────────────────────────────────────────
function setMode(m){
  mode=m;
  document.getElementById('btn-select').classList.toggle('active',m==='select');
  document.getElementById('btn-connect').classList.toggle('active',m==='connect');
  document.getElementById('st-mode').textContent=m==='select'?'Select':'Connect';
  wrap.classList.toggle('connect-mode',m==='connect');
  if(m==='select'){cancelConn();cancelFreehand();}
}

// ── Selection ─────────────────────────────────────────────────────────────────
function selectNode(id,additive=false){
  if(!additive)deselectAll();
  if(id){selected.add(id);highlightNode(id,true);nodes[id]?.g.classList.add('selected');}
}
function deselectAll(){
  selected.forEach(id=>{highlightNode(id,false);nodes[id]?.g.classList.remove('selected');});
  selected.clear();
  selectedEdges.forEach(id=>highlightEdge(id,false));
  selectedEdges.clear();
}
function highlightEdge(id,on){
  const e=edges.find(e=>e.id===id);if(!e)return;
  e.pathEl.setAttribute('stroke',on?'#E8503A':'#6B7280');
  e.pathEl.setAttribute('stroke-width',on?'2.5':'2');
  e.pathEl.setAttribute('marker-end',on?'url(#arrow-sel)':'url(#arrow)');
}
function highlightNode(id,on){
  const n=nodes[id];if(!n)return;
  if(on){n.bodyEl.setAttribute('stroke','#E8503A');n.bodyEl.setAttribute('stroke-width','2.5');}
  else  {n.bodyEl.setAttribute('stroke',shapeStroke(n.shape));n.bodyEl.setAttribute('stroke-width','1.5');}
}
function shapeStroke(s){return{step:'#D1D5DB',decision:'#FCD34D',terminal:'#86EFAC',action:'#93C5FD'}[s]||'#D1D5DB';}
function shapeFill(s){return{step:'#ffffff',decision:'#FFFBEB',terminal:'#F0FDF4',action:'#EFF6FF'}[s]||'#fff';}

// ── Update node geometry (resize) ─────────────────────────────────────────────
function updateNodeGeometry(id){
  const n=nodes[id];if(!n)return;
  const{shape,w,h,bodyEl,portEls,resizeEl}=n;
  if(shape==='decision'){
    bodyEl.setAttribute('points',`${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}`);
  }else{
    bodyEl.setAttribute('width',w);bodyEl.setAttribute('height',h);
    if(shape==='terminal')bodyEl.setAttribute('rx',h/2);
  }
  ['n','s','e','w'].forEach(p=>{
    const o=portOffset(n,p);
    portEls[p].setAttribute('cx',o.x);portEls[p].setAttribute('cy',o.y);
  });
  if(resizeEl){resizeEl.setAttribute('x',w-14);resizeEl.setAttribute('y',h-14);}
  refreshTextEl(id);
}

// ── Add node ──────────────────────────────────────────────────────────────────
function nodeDims(shape){
  if(shape==='decision')return{w:DIAM_W,h:DIAM_H};
  if(shape==='terminal')return{w:NODE_W,h:TERM_H};
  return{w:NODE_W,h:NODE_H};
}

function addNode(shape,x,y,label){
  const id='n'+(++nodeCounter);
  const{w,h}=nodeDims(shape);
  if(x==null){
    x=wrap.offsetWidth/2-w/2+(Math.random()*40-20);
    y=wrap.offsetHeight/2-h/2+(Math.random()*40-20);
  }
  label=label||{step:'Step',decision:'Decision?',terminal:'Start/End',action:'Action'}[shape]||'Node';

  const g=svgEl('g',{class:'node-g','data-id':id,'data-shape':shape});
  g.style.cursor='grab';

  let bodyEl;
  if(shape==='decision'){
    bodyEl=svgEl('polygon',{points:`${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}`,fill:shapeFill(shape),stroke:shapeStroke(shape),'stroke-width':'1.5'});
  }else if(shape==='terminal'){
    bodyEl=svgEl('rect',{x:0,y:0,width:w,height:h,rx:h/2,fill:shapeFill(shape),stroke:shapeStroke(shape),'stroke-width':'1.5'});
  }else{
    bodyEl=svgEl('rect',{x:0,y:0,width:w,height:h,rx:shape==='step'?6:3,fill:shapeFill(shape),stroke:shapeStroke(shape),'stroke-width':'1.5'});
  }
  g.appendChild(bodyEl);

  // SVG text with tspan wrapping
  const textEl=buildTextEl(label,w,h);
  g.appendChild(textEl);

  // Port dots
  const portEls={};
  ['n','s','e','w'].forEach(p=>{
    const o=portOffset({w,h},p);
    const dot=svgEl('circle',{cx:o.x,cy:o.y,r:5,fill:'#fff',stroke:'#9CA3AF','stroke-width':'2',class:'port','data-port':p,'data-node':id,style:'cursor:crosshair;display:none;'});
    g.appendChild(dot);portEls[p]=dot;
  });

  // Resize handle (16×16, bottom-right corner)
  const resizeEl=svgEl('rect',{x:w-14,y:h-14,width:14,height:14,rx:3,class:'resize-handle','data-node':id});
  g.appendChild(resizeEl);

  g.addEventListener('mousedown',onNodeMousedown);
  g.addEventListener('dblclick',onNodeDblclick);
  g.addEventListener('mouseenter',()=>{if(mode==='connect')Object.values(portEls).forEach(d=>d.style.display='');});
  g.addEventListener('mouseleave',()=>{Object.values(portEls).forEach(d=>d.style.display='none');clearSnapHighlight();});

  Object.entries(portEls).forEach(([p,dot])=>{
    dot.addEventListener('mousedown',e=>{
      if(mode!=='connect')return;
      e.stopPropagation();e.preventDefault();
      const pt=portPos(id,p);
      conn={fromId:id,fromPort:p};
      previewLn.style.display='';
      previewLn.setAttribute('d',`M${pt.x},${pt.y} L${pt.x},${pt.y}`);
    });
  });

  resizeEl.addEventListener('mousedown',e=>{
    if(mode!=='select')return;
    e.stopPropagation();e.preventDefault();
    closeNodeEdit();
    const pt=c2w(e.clientX,e.clientY);
    const n=nodes[id];
    resize={nodeId:id,startW:n.w,startH:n.h,startPt:pt};
  });

  g.setAttribute('transform',`translate(${x},${y})`);
  nodesG.appendChild(g);
  nodes[id]={id,shape,x,y,w,h,label,g,bodyEl,textEl,portEls,resizeEl};
  updateStatus();
  return id;
}

// ── Inline node label editing (textarea overlay) ──────────────────────────────
function openNodeEdit(id){
  if(editingNodeId===id)return;
  closeNodeEdit();
  editingNodeId=id;
  const n=nodes[id];
  // canvas-wrap is the offset parent; SVG coords == CSS px coords here
  nodeEditTa.style.display='block';
  nodeEditTa.style.left= n.x + 'px';
  nodeEditTa.style.top=  n.y + 'px';
  nodeEditTa.style.width= n.w + 'px';
  nodeEditTa.style.height= n.h + 'px';
  nodeEditTa.style.padding= PAD_Y + 'px ' + PAD_X + 'px';
  nodeEditTa.value=n.label;
  // Hide SVG text while editing
  if(n.textEl)n.textEl.style.display='none';
  // Focus after paint so blur from the dblclick doesn't immediately close it
  requestAnimationFrame(()=>{ nodeEditTa.focus(); nodeEditTa.select(); });
}

function closeNodeEdit(){
  if(!editingNodeId)return;
  const id=editingNodeId;
  editingNodeId=null;          // clear first so blur re-entry is a no-op
  const n=nodes[id];
  if(n){
    const newLabel=nodeEditTa.value.trim()||n.label;
    n.label=newLabel;
    if(n.textEl)n.textEl.style.display='';
    refreshTextEl(id);
    redrawEdges();
  }
  nodeEditTa.style.display='none';
  nodeEditTa.value='';
}

nodeEditTa.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();closeNodeEdit();}
  if(e.key==='Escape'){
    const n=nodes[editingNodeId];
    editingNodeId=null;
    if(n&&n.textEl)n.textEl.style.display='';
    nodeEditTa.style.display='none';nodeEditTa.value='';
  }
  e.stopPropagation();
});
nodeEditTa.addEventListener('blur',()=>{
  // Small delay so a resize-handle click doesn't accidentally close editing
  setTimeout(closeNodeEdit, 80);
});

// ── Node interactions ─────────────────────────────────────────────────────────
function onNodeMousedown(e){
  if(e.target.classList.contains('port'))return;
  if(e.target.classList.contains('resize-handle'))return;
  if(mode!=='select')return;
  e.stopPropagation();
  closeNodeEdit();
  const id=e.currentTarget.dataset.id;
  if(e.shiftKey){
    if(selected.has(id)){selected.delete(id);highlightNode(id,false);nodes[id]?.g.classList.remove('selected');}
    else selectNode(id,true);
    return;
  }
  if(!selected.has(id))selectNode(id,false);
  const wPt=c2w(e.clientX,e.clientY);
  const nodeStarts={};
  selected.forEach(sid=>nodeStarts[sid]={x:nodes[sid].x,y:nodes[sid].y});
  drag={startPt:wPt,nodeStarts};
}

function onNodeDblclick(e){
  if(e.target.classList.contains('port'))return;
  if(e.target.classList.contains('resize-handle'))return;
  e.stopPropagation();
  if(mode!=='select')return;
  openNodeEdit(e.currentTarget.dataset.id);
}

// ── Canvas events ─────────────────────────────────────────────────────────────
wrap.addEventListener('mousedown',e=>{
  if(e.target===nodeEditTa)return;
  closeNodeEdit();
  const isBackground=e.target===wrap||e.target===mainSvg||e.target===edgesG||e.target===nodesG||e.target===selBoxEl;
  if(!isBackground)return;
  const pt=c2w(e.clientX,e.clientY);
  if(mode==='select'){
    deselectAll();
    selBox={startX:pt.x,startY:pt.y,curX:pt.x,curY:pt.y};
    selBoxEl.style.display='block';
    selBoxEl.style.left=pt.x+'px';selBoxEl.style.top=pt.y+'px';
    selBoxEl.style.width='0';selBoxEl.style.height='0';
  }
  if(mode==='connect'){
    freehand={pts:[pt],pathStr:`M${pt.x},${pt.y}`};
    freehandP.style.display='';
    freehandP.setAttribute('d',freehand.pathStr);
  }
});

document.addEventListener('mousemove',e=>{
  const pt=c2w(e.clientX,e.clientY);

  if(resize){
    const n=nodes[resize.nodeId];if(!n){resize=null;return;}
    const dx=pt.x-resize.startPt.x,dy=pt.y-resize.startPt.y;
    n.w=Math.max(MIN_W[n.shape]||80,resize.startW+dx);
    n.h=Math.max(MIN_H[n.shape]||36,resize.startH+dy);
    updateNodeGeometry(resize.nodeId);redrawEdges();
    return;
  }

  if(drag){
    const dx=pt.x-drag.startPt.x,dy=pt.y-drag.startPt.y;
    Object.entries(drag.nodeStarts).forEach(([sid,start])=>{
      const n=nodes[sid];if(!n)return;
      n.x=start.x+dx;n.y=start.y+dy;
      n.g.setAttribute('transform',`translate(${n.x},${n.y})`);
    });
    redrawEdges();return;
  }

  if(selBox){
    selBox.curX=pt.x;selBox.curY=pt.y;
    const rx=Math.min(selBox.startX,pt.x),ry=Math.min(selBox.startY,pt.y);
    const rw=Math.abs(pt.x-selBox.startX),rh=Math.abs(pt.y-selBox.startY);
    selBoxEl.style.left=rx+'px';selBoxEl.style.top=ry+'px';
    selBoxEl.style.width=rw+'px';selBoxEl.style.height=rh+'px';
    deselectAll();
    Object.values(nodes).forEach(n=>{
      const cx=n.x+n.w/2,cy=n.y+n.h/2;
      if(cx>rx&&cx<rx+rw&&cy>ry&&cy<ry+rh)selectNode(n.id,true);
    });
    edges.forEach(edge=>{
      if(edgeInBox(edge,rx,ry,rw,rh)){selectedEdges.add(edge.id);highlightEdge(edge.id,true);}
    });
    return;
  }

  if(conn){
    snapPort=null;let bestD=28;
    Object.values(nodes).forEach(n=>{
      if(n.id===conn.fromId)return;
      ['n','s','e','w'].forEach(p=>{
        const pp=portPos(n.id,p),d=Math.hypot(pp.x-pt.x,pp.y-pt.y);
        if(d<bestD){bestD=d;snapPort={nodeId:n.id,port:p};}
      });
    });
    updateSnapHighlight();
    const src=portPos(conn.fromId,conn.fromPort);
    const tgt=snapPort?portPos(snapPort.nodeId,snapPort.port):pt;
    previewLn.setAttribute('d',straightPath(src.x,src.y,tgt.x,tgt.y,conn.fromPort,snapPort?.port||'n'));
    return;
  }

  if(freehand){
    freehand.pts.push(pt);
    freehand.pathStr+=` L${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
    freehandP.setAttribute('d',freehand.pathStr);
  }
});

document.addEventListener('mouseup',e=>{
  const pt=c2w(e.clientX,e.clientY);
  if(resize){resize=null;return;}
  if(drag){drag=null;return;}
  if(selBox){selBox=null;selBoxEl.style.display='none';return;}
  if(conn){
    clearSnapHighlight();
    previewLn.style.display='none';previewLn.setAttribute('d','');
    if(snapPort)finishConn(snapPort.nodeId,snapPort.port);
    conn=null;snapPort=null;return;
  }
  if(freehand){
    freehandP.style.display='none';freehandP.setAttribute('d','');
    finishFreehand(freehand.pts,pt);freehand=null;
  }
});

// ── Connection helpers ────────────────────────────────────────────────────────
function finishConn(toId,toPort){
  if(!conn)return;
  const dup=edges.find(e=>e.from===conn.fromId&&e.fromPort===conn.fromPort&&e.to===toId&&e.toPort===toPort);
  if(dup)return;
  const id='e'+(++edgeCounter);
  const pathEl=svgEl('path',{stroke:'#6B7280','stroke-width':'2',fill:'none','marker-end':'url(#arrow)',style:'cursor:pointer;','stroke-linecap':'round'});
  const hitEl=svgEl('path',{stroke:'transparent','stroke-width':'12',fill:'none',style:'cursor:pointer;'});
  hitEl.dataset.edgeId=id;hitEl.addEventListener('click',onEdgeClick);
  pathEl.dataset.edgeId=id;pathEl.addEventListener('click',onEdgeClick);
  edgesG.appendChild(pathEl);edgesG.appendChild(hitEl);
  // Edge label as native SVG (renders in Notion export)
  const labelG=svgEl('g',{class:'edge-label-g','data-edge-id':id});
  const labelBg=svgEl('rect',{class:'edge-label-bg',rx:3,fill:'#fff',stroke:'#e0e0e0','stroke-width':'1'});
  const labelTx=svgEl('text',{class:'edge-label-text','text-anchor':'middle','dominant-baseline':'middle'});
  labelG.appendChild(labelBg);labelG.appendChild(labelTx);
  labelG.style.display='none';
  edgesG.appendChild(labelG);
  const edge={id,from:conn.fromId,fromPort:conn.fromPort,to:toId,toPort,label:'',pathEl,hitEl,labelG,labelBg,labelTx};
  edges.push(edge);redrawEdge(edge);updateStatus();
}

function finishFreehand(pts,endPt){
  if(pts.length<3)return;
  const startPt=pts[0];
  let fromNode=null,fromDist=40;
  Object.values(nodes).forEach(n=>{
    if(startPt.x>=n.x-8&&startPt.x<=n.x+n.w+8&&startPt.y>=n.y-8&&startPt.y<=n.y+n.h+8){
      const d=Math.hypot(startPt.x-n.x-n.w/2,startPt.y-n.y-n.h/2);
      if(d<fromDist){fromDist=d;fromNode=n.id;}
    }
  });
  let toNode=null,toDist=40;
  Object.values(nodes).forEach(n=>{
    if(endPt.x>=n.x-8&&endPt.x<=n.x+n.w+8&&endPt.y>=n.y-8&&endPt.y<=n.y+n.h+8){
      const d=Math.hypot(endPt.x-n.x-n.w/2,endPt.y-n.y-n.h/2);
      if(d<toDist){toDist=d;toNode=n.id;}
    }
  });
  if(!fromNode||!toNode||fromNode===toNode)return;
  const fromPort=bestPortForDir(endPt.x-startPt.x,endPt.y-startPt.y);
  const toPort=bestPortForDir(startPt.x-endPt.x,startPt.y-endPt.y);
  if(edges.find(e=>e.from===fromNode&&e.to===toNode))return;
  conn={fromId:fromNode,fromPort};finishConn(toNode,toPort);conn=null;
}

function bestPortForDir(dx,dy){
  if(Math.abs(dx)>Math.abs(dy))return dx>0?'e':'w';
  return dy>0?'s':'n';
}

function cancelConn(){conn=null;snapPort=null;previewLn.style.display='none';previewLn.setAttribute('d','');clearSnapHighlight();}
function cancelFreehand(){freehand=null;freehandP.style.display='none';freehandP.setAttribute('d','');}

function updateSnapHighlight(){
  Object.values(nodes).forEach(n=>{
    Object.entries(n.portEls).forEach(([p,dot])=>{
      const isSnap=snapPort&&n.id===snapPort.nodeId&&p===snapPort.port;
      if(isSnap){dot.style.display='';dot.setAttribute('fill','#E8503A');dot.setAttribute('stroke','#E8503A');}
      else if(n.id===conn?.fromId){}
      else{dot.style.display='none';dot.setAttribute('fill','#fff');dot.setAttribute('stroke','#9CA3AF');}
    });
  });
  if(snapPort){const n=nodes[snapPort.nodeId];if(n)Object.values(n.portEls).forEach(d=>d.style.display='');}
}

function clearSnapHighlight(){
  Object.values(nodes).forEach(n=>{
    Object.values(n.portEls).forEach(dot=>{dot.style.display='none';dot.setAttribute('fill','#fff');dot.setAttribute('stroke','#9CA3AF');});
  });
}

// ── Edge-in-box hit test ──────────────────────────────────────────────────────
function edgeInBox(edge,rx,ry,rw,rh){
  const p1=portPos(edge.from,edge.fromPort),p2=portPos(edge.to,edge.toPort);
  const fv=edge.fromPort==='n'||edge.fromPort==='s',tv=edge.toPort==='n'||edge.toPort==='s';
  let pts;
  if(fv&&tv){const my=(p1.y+p2.y)/2;pts=[[p1.x,p1.y],[p1.x,my],[p2.x,my],[p2.x,p2.y]];}
  else if(!fv&&!tv){const mx=(p1.x+p2.x)/2;pts=[[p1.x,p1.y],[mx,p1.y],[mx,p2.y],[p2.x,p2.y]];}
  else if(fv) pts=[[p1.x,p1.y],[p1.x,p2.y],[p2.x,p2.y]];
  else        pts=[[p1.x,p1.y],[p2.x,p1.y],[p2.x,p2.y]];
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0],ay=pts[i][1],bx=pts[i+1][0],by=pts[i+1][1];
    for(let t=0;t<=1;t+=0.125){
      const sx=ax+(bx-ax)*t,sy=ay+(by-ay)*t;
      if(sx>=rx&&sx<=rx+rw&&sy>=ry&&sy<=ry+rh)return true;
    }
  }
  return false;
}

// ── Edge drawing ──────────────────────────────────────────────────────────────
function redrawEdge(edge){
  const p1=portPos(edge.from,edge.fromPort),p2=portPos(edge.to,edge.toPort);
  const d=straightPath(p1.x,p1.y,p2.x,p2.y,edge.fromPort,edge.toPort);
  edge.pathEl.setAttribute('d',d);
  if(edge.hitEl)edge.hitEl.setAttribute('d',d);
  if(edge.label){
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    edge.labelTx.textContent=edge.label;
    const tw=edge.label.length*6.2+10, th=16;
    edge.labelBg.setAttribute('x',(mx-tw/2).toFixed(1));
    edge.labelBg.setAttribute('y',(my-th/2).toFixed(1));
    edge.labelBg.setAttribute('width',tw.toFixed(1));
    edge.labelBg.setAttribute('height',th);
    edge.labelTx.setAttribute('x',mx.toFixed(1));
    edge.labelTx.setAttribute('y',my.toFixed(1));
    edge.labelG.style.display='';
  }else if(edge.labelG) edge.labelG.style.display='none';
}
function redrawEdges(){edges.forEach(redrawEdge);}

function onEdgeClick(e){
  e.stopPropagation();
  const edge=edges.find(ed=>ed.id===e.currentTarget.dataset.edgeId);if(!edge)return;
  deselectAll();selectedEdges.add(edge.id);highlightEdge(edge.id,true);
  if(e.detail===2){
    const inp=document.getElementById('edge-label-input');
    inp.value=edge.label;inp.style.display='block';
    // Position near click, offset from canvas top-left
    const wr=wrap.getBoundingClientRect();
    inp.style.left=(e.clientX-wr.left-40)+'px';inp.style.top=(e.clientY-wr.top-14)+'px';
    inp.focus();inp.select();
    const commit=()=>{edge.label=inp.value.trim();inp.style.display='none';redrawEdge(edge);};
    inp.onkeydown=ev=>{
      if(ev.key==='Enter'){commit();}
      if(ev.key==='Escape')inp.style.display='none';
      ev.stopPropagation();
    };
    inp.onblur=commit;
  }
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='v'||e.key==='V')setMode('select');
  if(e.key==='c'||e.key==='C')setMode('connect');
  if(e.key==='s'||e.key==='S')addNode('step');
  if(e.key==='d'||e.key==='D')addNode('decision');
  if(e.key==='t'||e.key==='T')addNode('terminal');
  if(e.key==='a'||e.key==='A')addNode('action');
  if(e.key==='Delete'||e.key==='Backspace')deleteSelected();
  if(e.key==='Escape'){cancelConn();cancelFreehand();deselectAll();}
});

function deleteSelected(){
  if(!selected.size&&!selectedEdges.size)return;
  selectedEdges.forEach(eid=>{
    const idx=edges.findIndex(e=>e.id===eid);
    if(idx!==-1){edges[idx].pathEl.remove();edges[idx].hitEl?.remove();edges[idx].labelG?.remove();edges.splice(idx,1);}
  });
  selectedEdges.clear();
  selected.forEach(id=>{
    edges=edges.filter(edge=>{
      if(edge.from===id||edge.to===id){edge.pathEl.remove();edge.hitEl?.remove();edge.labelG?.remove();return false;}
      return true;
    });
    nodes[id]?.g.remove();delete nodes[id];
  });
  selected.clear();updateStatus();
}

function updateStatus(){
  document.getElementById('st-nodes').textContent=Object.keys(nodes).length;
  document.getElementById('st-edges').textContent=edges.length;
}

// ── Clear ─────────────────────────────────────────────────────────────────────
function clearCanvas(){
  if(Object.keys(nodes).length>0&&!confirm('Clear canvas?'))return;
  closeNodeEdit();
  Object.values(nodes).forEach(n=>n.g.remove());
  nodes={};selected.clear();
  edges.forEach(e=>{e.pathEl.remove();e.hitEl?.remove();e.labelG?.remove();});
  edges=[];nodeCounter=0;edgeCounter=0;updateStatus();
}

// ── Export SVG ────────────────────────────────────────────────────────────────
// Uses pure SVG <text>/<tspan> so text renders in ALL SVG viewers (Notion, Figma, etc.)
function exportSVG(){
  if(!Object.keys(nodes).length){showToast('Add nodes first.','warn');return false;}
  closeNodeEdit();
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  Object.values(nodes).forEach(n=>{
    minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);
    maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+n.h);
  });
  const pad=40;minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const W=maxX-minX,H=maxY-minY;
  const clone=mainSvg.cloneNode(true);
  clone.setAttribute('width',W);clone.setAttribute('height',H);
  clone.setAttribute('viewBox',`${minX} ${minY} ${W} ${H}`);
  // Remove UI-only elements
  clone.querySelectorAll('#preview-line,#freehand-path,.port,.resize-handle').forEach(el=>el.remove());
  // Remove invisible hit-area paths (transparent stroke)
  clone.querySelectorAll('path[stroke="transparent"]').forEach(el=>el.remove());
  // Remove hidden edge label groups
  clone.querySelectorAll('.edge-label-g').forEach(el=>{
    if(el.style.display==='none')el.remove();
    else el.removeAttribute('style');
  });
  // Strip cursor styles from paths/nodes but keep display:none removed elements gone
  clone.querySelectorAll('[style]').forEach(el=>{
    const s=el.getAttribute('style')||'';
    if(s.includes('display:none')){el.remove();return;}
    el.removeAttribute('style');
  });
  // Make sure all text elements are visible
  clone.querySelectorAll('text').forEach(el=>el.removeAttribute('style'));
  // Reset any selection highlights
  clone.querySelectorAll('[stroke="#E8503A"]').forEach(el=>{
    const id=el.closest('[data-shape]')?.dataset.shape;
    const strokes={step:'#D1D5DB',decision:'#FCD34D',terminal:'#86EFAC',action:'#93C5FD'};
    if(id)el.setAttribute('stroke',strokes[id]||'#D1D5DB');
    el.setAttribute('stroke-width','1.5');
  });
  const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>',clone.outerHTML],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='flowchart.svg';a.click();
  URL.revokeObjectURL(url);
  return true;
}

// ── Save to Notion ────────────────────────────────────────────────────────────
const NOTION_DB_URL='https://app.notion.com/p/73b895456021436981e354dfa3916bef';
function saveToNotion(){
  if(!exportSVG())return;
  setTimeout(()=>window.open(NOTION_DB_URL,'_blank'),400);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg,type){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:48px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:8px;font-size:13px;font-family:inherit;z-index:9999;transition:opacity 0.3s;pointer-events:none;';document.body.appendChild(t);}
  t.textContent=msg;t.style.background=type==='ok'?'#1B2B4B':'#E8503A';t.style.color='#fff';t.style.opacity='1';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',2200);
}

// ── Sample ────────────────────────────────────────────────────────────────────
function loadSample(){
  clearCanvas();
  const cx=wrap.offsetWidth/2,g=120;
  const s =addNode('terminal',cx-70, 60,      'Start');
  const q1=addNode('decision',cx-70, 60+g,    'Is the requester Brian Stai?');
  const im=addNode('action',  cx-240,60+g*2,  'Delete the invoice(s) for Brian');
  const ma=addNode('step',    cx+60, 60+g*2,  'Ask what they want to do with the invoice');
  const q2=addNode('decision',cx+60, 60+g*3,  'What is the requested action?');
  const rv=addNode('action',  cx-40, 60+g*4,  'Ask the user to contact Dorothy Park to acknowledge the error');
  const ask=addNode('step',   cx+160,60+g*4,  'Ask why the invoice needs to be deleted');
  const tag=addNode('step',   cx+160,60+g*5,  'Tag Julian in the Slack thread');
  const ok=addNode('terminal',cx-40, 60+g*6,  'Resolved');

  setTimeout(()=>{
    function link(a,ap,b,bp,lbl){
      conn={fromId:a,fromPort:ap};finishConn(b,bp);conn=null;
      if(lbl){edges[edges.length-1].label=lbl;redrawEdge(edges[edges.length-1]);}
    }
    link(s,'s',q1,'n');
    link(q1,'w',im,'n','YES');
    link(q1,'e',ma,'n','NO');
    link(ma,'s',q2,'n');
    link(q2,'w',rv,'n','Clear Error Center');
    link(q2,'e',ask,'n','Delete Actual Invoice');
    link(ask,'s',tag,'n');
    link(im,'s',ok,'n');
    link(rv,'s',ok,'n');
    link(tag,'s',ok,'e');
    updateStatus();
  },50);
}

loadSample();
